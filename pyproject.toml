[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "experimentlens"
version = "0.1.0"
description = "Evidence-first analysis workspace for computational experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agent", "experiment-tracking", "machine-learning", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "alembic>=1.16,<2",
  "a2wsgi>=1.10,<2",
  "fastapi>=0.116,<1",
  "Flask>=3.1,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
experimentlens = "experimentlens.app:main"
experimentlens-api = "experimentlens.control_plane:main"
experimentlens-eval = "experimentlens.evaluation.runner:main"
experimentlens-worker = "experimentlens.agent.worker:main"
experimentlens-benchmark = "experimentlens.reliability:main"

[tool.hatch.build.targets.wheel]
packages = ["py-src/experimentlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py-src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
